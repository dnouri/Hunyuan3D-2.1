<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunyuan3D Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="file"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 4px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #28a745;
            transition: width 0.3s ease;
        }
        .log {
            font-family: monospace;
            font-size: 12px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin: 2px 0;
        }
        .log-entry.error {
            color: #dc3545;
        }
        .log-entry.success {
            color: #28a745;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            border-radius: 4px;
            display: none;
        }
        .result a {
            color: #155724;
            font-weight: 600;
        }
        .preview {
            margin-top: 10px;
        }
        .preview img {
            max-width: 200px;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Hunyuan3D-2.1 Generator</h1>
    <p>Generate 3D meshes from images using the Hunyuan3D API.</p>

    <form id="generateForm">
        <div class="form-group">
            <label for="apiUrl">API URL</label>
            <input type="text" id="apiUrl" value="https://your-app.modal.run" required>
        </div>

        <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="text" id="apiKey" placeholder="sk_live_xxx" required>
        </div>

        <div class="form-group">
            <label for="imageFile">Image</label>
            <input type="file" id="imageFile" accept="image/png,image/jpeg" required>
            <div class="preview" id="preview"></div>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="generateTexture" checked>
            <label for="generateTexture" style="margin-bottom: 0;">Generate PBR textures</label>
        </div>

        <div class="form-group">
            <label for="seed">Seed (optional)</label>
            <input type="number" id="seed" placeholder="Leave empty for random">
        </div>

        <button type="submit" id="submitBtn">Generate 3D Mesh</button>
    </form>

    <div id="status">
        <div>Status: <span id="statusText">Connecting...</span></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="log" id="log"></div>
    </div>

    <div id="result" class="result">
        <strong>Generation Complete!</strong>
        <p>Job ID: <span id="jobId"></span></p>
        <p><a id="downloadLink" href="#" target="_blank">Download GLB File</a></p>
    </div>

    <script>
        // Image preview
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const preview = document.getElementById('preview');
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        });

        // Form submission
        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const imageFile = document.getElementById('imageFile').files[0];
            const generateTexture = document.getElementById('generateTexture').checked;
            const seed = document.getElementById('seed').value;

            if (!imageFile) {
                alert('Please select an image');
                return;
            }

            // Show status, hide result
            document.getElementById('status').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('log').innerHTML = '';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('submitBtn').disabled = true;

            // Build form data
            const formData = new FormData();
            formData.append('image', imageFile);
            formData.append('generate_texture', generateTexture.toString());
            if (seed) {
                formData.append('seed', seed);
            }

            log('Connecting to API...');

            try {
                const response = await fetch(`${apiUrl}/generate/stream`, {
                    method: 'POST',
                    headers: {
                        'X-API-Key': apiKey,
                    },
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }

                // Read SSE stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let currentEvent = null;

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, {stream: true});

                    // Process complete lines
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line in buffer

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            currentEvent = line.slice(7);
                        } else if (line.startsWith('data: ') && currentEvent) {
                            const data = JSON.parse(line.slice(6));
                            handleEvent(currentEvent, data);
                            currentEvent = null;
                        }
                    }
                }

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                updateStatus('Error: ' + error.message);
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });

        function handleEvent(eventType, data) {
            switch (eventType) {
                case 'started':
                    log(`Started: job_id=${data.job_id}`);
                    updateStatus('Generation started...');
                    break;

                case 'progress':
                    const percent = data.percent || 0;
                    const stage = data.stage || 'processing';
                    document.getElementById('progressFill').style.width = `${percent}%`;
                    updateStatus(`${stage} (${percent}%)`);
                    log(`Progress: ${stage} - ${percent}%`);
                    break;

                case 'completed':
                    log('Generation completed!', 'success');
                    updateStatus('Complete!');
                    document.getElementById('progressFill').style.width = '100%';
                    document.getElementById('jobId').textContent = data.job_id;
                    document.getElementById('downloadLink').href = data.download_url;
                    document.getElementById('result').style.display = 'block';
                    break;

                case 'error':
                    log(`Error: ${data.message}`, 'error');
                    log(`  Stage: ${data.stage}`, 'error');
                    log(`  Retriable: ${data.retriable}`, 'error');
                    updateStatus('Error: ' + data.message);
                    break;
            }
        }

        function log(message, type = '') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(text) {
            document.getElementById('statusText').textContent = text;
        }
    </script>
</body>
</html>
